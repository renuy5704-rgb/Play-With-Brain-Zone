<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Play With Brain Zone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    color: #d8e4ea;
    margin-bottom: 30px;
}

.game {
    display: block;
    padding: 20px;
    margin: 16px 0;
    border-radius: 18px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    transition: 0.2s;
}

.game:hover {
    transform: scale(1.03);
    background: rgba(255,255,255,0.20);
}

.game:active {
    transform: scale(0.97);
}

.footer {
    margin-top: 25px;
    font-size: 13px;
    color: #b8c7ce;
}
</style>
</head>

<body>

<div class="container">

    <h1>🧠 Play With Brain Zone 🎮</h1>

    <div class="subtitle">
        Choose a game and start playing!
    </div>

    <a class="game"
       href="https://renuy5704-rgb.github.io/Crowdnumbers/">
        🧠 Number Reasoning
    </a>

    <a class="game"
       href="https://renuy5704-rgb.github.io/Snake-feed/">
        🐍 Snake Game
    </a>

    <a class="game"
       href="https://renuy5704-rgb.github.io/Tuc-tac-toe/">
        ❌ Tic-Tac-Toe
    </a>

    <div class="footer">
        Play • Think • Challenge Yourself
    </div>

</div>

</body>
</html>
